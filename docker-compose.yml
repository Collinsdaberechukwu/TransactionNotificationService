services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: collinso
      MYSQL_DATABASE: TransactionNotificationDb
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3309:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 30s
      retries: 5
#      start_period: 40s

  backend:
    build: .
    container_name: backend-container
    restart: always
    expose:
      - '9000'
    networks:
      - network
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/TransactionNotificationDb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: collinso
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SERVER_PORT: 16221

  nginx:
        image: nginx:latest
        container_name: nginx-container
        ports:
          - "16221:16221"
        depends_on:
          - backend
        volumes:
          - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  database_data:

networks:
  network:
    driver: bridge